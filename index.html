<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spiritual Dream Interpreter</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <h1>🔮 Spiritual Dream Interpreter</h1>
    <p>Unifying mystical insights from ancient traditions to decode your dreams.</p>

    <!-- Header Image -->
    <div class="header-image">
      <img src="https://img1.daumcdn.net/thumb/R800x0/?scode=mtistory2&fname=https:%2F%2Fblog.kakaocdn.net%2Fdn%2FGC0Mx%2FbtsDGo38q1f%2F73sKQXCsl19ewXDrKl5BYK%2Fimg.png" alt="Spiritual Symbol" />
    </div>

    <!-- Textarea for Dream Input -->
    <textarea id="dreamInput" placeholder="Type your dream here..."></textarea>
    <button onclick="interpretDream()">Interpret Dream</button>

    <!-- Display Results -->
    <div id="results"></div>

    <!-- Footer with Author Information and Image -->
    <footer>
      <div class="footer-content">
        <p>Made with ❤️ by <strong>Alok Pandey</strong></p>
        <div class="footer-image">
          <img src="https://i.pinimg.com/originals/e6/27/ec/e627ecd304b3fba523d8a28833193870.jpg" alt="Alok Pandey" />
        </div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
